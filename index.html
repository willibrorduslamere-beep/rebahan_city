<head>

<style>
:root{--bg:#2a2347;--panel:#f6f3ff;--ink:#241f3a;--line:#5b4b8a;--acc:#e8567a;--gold:#7fe0c4;--mut:#6a6585;--ok:#1f8a78;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Segoe UI",Verdana,sans-serif;color:var(--ink);overflow:hidden}

p{line-height:1.5;margin:6px 0}

.stamp.w{border-color:#a56a00;color:#a56a00}

.btn{box-shadow:0 2px 8px rgba(58,143,224,.3)}

<script>
const ADMIN_CODE="161107", N=12, KEY="rebahan-city-v1";
let S={start:Date.now(),jadwal:"19:00",warga:{},log:[],flights:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let isAdmin=false, me="", tab="peta", planes=[];
try{me=localStorage.getItem(KEY+"-me")||""}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(save.h);save.h=setTimeout(syncWarga,1500)};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ts=>new Date(ts).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const log=m=>{S.log.unshift({t:Date.now(),m});S.log=S.log.slice(0,80)};

/* ---------- peta ---------- */
const cv=$("#cv");let ctx=cv.getContext("2d");const mainCtx=ctx;
const mod=(a,b)=>((a%b)+b)%b;
const isPlaza=(i,j)=>Math.abs(i)<=2&&Math.abs(j)<=2;
/* ---------- zona khusus: Taman Tugu, Persawahan, Peternakan, Tambang ---------- */
const ZN=[{k:"tugu",i0:-8,i1:-4,j0:-8,j1:-4},{k:"sawah",i0:10,i1:11,j0:4,j1:11},{k:"ternak",i0:10,i1:11,j0:-11,j1:-4},{k:"tambang",i0:-11,i1:-10,j0:4,j1:11}];
const zoneOf=(i,j)=>{for(const z of ZN)if(i>=z.i0&&i<=z.i1&&j>=z.j0&&j<=z.j1)return z.k;return null};
const ZBLK={"-6,-6":1,"10,-8":1,"11,-8":1,"-11,7":1,"-10,9":1,"11,9":1};
const isRoadL=(i,j)=>!isPlaza(i,j)&&(mod(i,3)===0||mod(j,3)===0); /* definisi lama: dipakai menomori kavling agar blok warga lama tidak bergeser */
const isRoad=(i,j)=>isRoadL(i,j)&&!zoneOf(i,j);
const hsh=(i,j)=>((i*73856093)^(j*19349663))>>>0;
const isParkL=(i,j)=>!isPlaza(i,j)&&!isRoadL(i,j)&&hsh(i,j)%8===0;
const isPark=(i,j)=>isParkL(i,j)&&!zoneOf(i,j);
const isPos=(i,j)=>(i===4&&j===-4)||(i===-4&&j===4)||(i===8&&j===-8);
const FIRE=[5,-1],POLICE=[-5,1],isFire=(i,j)=>i===FIRE[0]&&j===FIRE[1],isPolice=(i,j)=>i===POLICE[0]&&j===POLICE[1],isSvc=(i,j)=>isFire(i,j)||isPolice(i,j);
const isMkt=(i,j)=>i>=10&&i<=11&&Math.abs(j)<=2&&mod(j,3)!==0&&mod(i,3)!==0;
const isPole=(i,j)=>(mod(i,3)===0&&mod(j,3)===1)||(mod(j,3)===0&&mod(i,3)===1);
const lots=[],lotAt={},B={i0:-N,i1:N,j0:-N,j1:N};
const inB=(i,j,b)=>i>=b.i0&&i<=b.i1&&j>=b.j0&&j<=b.j1;
const rr=(h,k)=>{let t=(h+Math.imul(k+1,0x9e3779b1))|0;t=Math.imul(t^(t>>>15),0x85ebca6b);t=Math.imul(t^(t>>>13),0xc2b2ae35);return((t^(t>>>16))>>>0)/4294967296};
/* kavling baru ditambahkan di BELAKANG daftar lama, jadi nomor blok warga lama tidak berubah */
function addLots(prev,next){const add=[];
  for(let i=next.i0;i<=next.i1;i++)for(let j=next.j0;j<=next.j1;j++)if(!(prev&&inB(i,j,prev))&&!isPlaza(i,j)&&!isRoadL(i,j)&&!isParkL(i,j)&&!isPos(i,j)&&!isMkt(i,j))add.push([i,j]);
  add.sort((a,b)=>(Math.hypot(a[0],a[1])-Math.hypot(b[0],b[1]))||a[0]-b[0]);
  add.forEach(l=>{lotAt[l[0]+","+l[1]]=lots.length;lots.push(l)});return add.length}
/* kota meluas 1 distrik ke barat, utara, dan selatan (timur dibatasi pasar/sungai/pelabuhan) */
function growB(){const p={...B};B.i0-=3;B.j0-=3;B.j1+=3;return addLots(p,B)}
addLots(null,B);
for(let r=0;r<(S.ring||0);r++)growB();
let V={x:-170,y:-60,z:.85};
const roofs=["#2f8f9d","#e8567a","#6c5bb5","#e0a030"],walls=["#fde7ef","#e5f4ee","#efe8fb","#fff3d6"];
function shade(h,f){const n=parseInt(h.slice(1),16);const c=k=>Math.max(0,Math.min(255,Math.round(((n>>k)&255)*f)));return`rgb(${c(16)},${c(8)},${c(0)})`}
function poly(p,f){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let k=2;k<p.length;k+=2)ctx.lineTo(p[k],p[k+1]);ctx.closePath();ctx.fillStyle=f;ctx.fill()}
function tile(x,y,f){poly([x,y-16,x+32,y,x,y+16,x-32,y],f)}
function house(x,y,s,roof,wall,big){
  const w=26*s,h=15*s,r=15*s;
  poly([x-w,y-h+w/2,x,y-h+w,x,y+w,x-w,y+w/2],shade(wall,.82));
  poly([x+w,y-h+w/2,x,y-h+w,x,y+w,x+w,y+w/2],shade(wall,.68));
  poly([x-w-3,y-h+w/2,x,y-h-r+w/2+2,x+w+3,y-h+w/2,x,y-h+w+2],roof);
  poly([x-w-3,y-h+w/2,x,y-h+w+2,x,y-h+w+6,x-w-3,y-h+w/2+4],shade(roof,.75));
  poly([x+w+3,y-h+w/2,x,y-h+w+2,x,y-h+w+6,x+w+3,y-h+w/2+4],shade(roof,.6));
  if(big){ctx.fillStyle="#fff";ctx.fillRect(x+2,y-h-r-22,3,26);poly([x+5,y-h-r-22,x+24,y-h-r-17,x+5,y-h-r-12],"#d22")}
}
const cir=(x,y,r,f)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=f;ctx.fill()};
function tree(x,y,s,k){
  if(k===2){ctx.strokeStyle="#7a5a3a";ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+2*s,y-18*s,x+6*s,y-36*s);ctx.stroke();ctx.strokeStyle="#3f9a4e";[-1,-.4,.4,1].forEach(d=>{ctx.beginPath();ctx.moveTo(x+6*s,y-36*s);ctx.quadraticCurveTo(x+6*s+d*10*s,y-46*s,x+6*s+d*18*s,y-30*s);ctx.stroke()});cir(x+6*s,y-34*s,3*s,"#6b4a2a");return}
  ctx.fillStyle="#6b4a2a";ctx.fillRect(x-2*s,y-12*s,4*s,12*s);
  if(k===1){poly([x,y-40*s,x-12*s,y-10*s,x+12*s,y-10*s],"#2f7d4f");poly([x,y-52*s,x-9*s,y-28*s,x+9*s,y-28*s],"#3b9460");return}
  cir(x,y-22*s,14*s,"#2f8a45");cir(x-6*s,y-27*s,10*s,"#4cae5c");cir(x+7*s,y-24*s,9*s,"#3f9a4e");
  if(k===3)[[-8,-26],[6,-30],[8,-20],[-2,-18]].forEach(p=>cir(x+p[0]*s,y+p[1]*s,2.5*s,"#f08fb4"))
}
function flora(x,y,v){const k=v%6;
  if(k<3)tree(x,y,.8,k);else if(k===4)tree(x,y,.8,3);
  else if(k===3){cir(x-6,y,6,"#3f9a4e");cir(x+5,y+1,7,"#4cae5c");cir(x,y-4,2,"#e84a5f");cir(x+7,y-3,2,"#ffd24a")}
  else[[-10,2],[-3,-3],[4,3],[10,-1]].forEach((p,n)=>cir(x+p[0],y+p[1],2.5,["#f08fb4","#ffd24a","#fff","#b48ae8"][n]))}
let VW=0,VH=0;
const vis=(x,y)=>{const sx=VW/2+V.x+x*V.z,sy=VH/2+V.y+y*V.z;return sx>-80*V.z&&sx<VW+80*V.z&&sy>-130*V.z&&sy<VH+60*V.z};
function plant(x,y,t,s){
  if(t<.3)tree(x,y,s,0);else if(t<.5)tree(x,y,s,1);else if(t<.62)tree(x,y,s,3);else if(t<.69)tree(x,y,s,2);
  else if(t<.86){cir(x-6*s,y,6*s,"#3f9a4e");cir(x+5*s,y+1,7*s,"#4cae5c");cir(x,y-4*s,2,"#e84a5f");cir(x+7*s,y-3*s,2,"#ffd24a")}
  else[[-10,2],[-3,-3],[4,3],[10,-1]].forEach((p,n)=>cir(x+p[0]*s,y+p[1]*s,2.5,["#f08fb4","#ffd24a","#fff","#b48ae8"][n]))}
function grove(x,y,h,n){const it=[];
  for(let k=0;k<n;k++){let u=rr(h,k*3)*2-1,v=rr(h,k*3+1)*2-1;const m=Math.abs(u)+Math.abs(v);if(m>.8){u*=.8/m;v*=.8/m}
    it.push([x+u*32,y+v*16,rr(h,k*3+2),.7+rr(h,k+40)*.35])}
  it.sort((a,b)=>a[1]-b[1]).forEach(p=>plant(p[0],p[1],p[2],p[3]))}
function park(x,y,h){poly([x,y-10,x+20,y,x,y+10,x-20,y],"#f3e4d0");
  if(h%2){cir(x,y-2,9,"#bfe6f0");cir(x,y-3,6,"#7fd0e8");cir(x,y-8,2,"#fff")}else{ctx.fillStyle="#7a5a3a";ctx.fillRect(x-8,y-6,16,4);ctx.fillRect(x-8,y-2,2,5);ctx.fillRect(x+6,y-2,2,5)}
  tree(x-22,y,.8,0);tree(x+22,y+2,.8,3);tree(x,y-8,.6,2)}
function house(x,y,s,roof,wall,m,lv,pt,big){
  const w=26*s,hh=(lv>=3?66:lv===2?50:38)*s*(big?.62:1),r=(m===1?7:24)*s*(big?.6:1),top=y-hh,L=(u,v)=>[x-w+u*w,top+w/2+u*w/2+v*hh],R=(u,v)=>[x+u*w,top+w-u*w/2+v*hh];
  poly([x-w,top+w/2,x,top+w,x,y+w,x-w,y+w/2],shade(wall,.82));
  poly([x+w,top+w/2,x,top+w,x,y+w,x+w,y+w/2],shade(wall,.68));
  ctx.strokeStyle="rgba(0,0,0,.2)";ctx.lineWidth=1;
  if(pt)for(let t=1;t<4;t++){const q=t/4,a=pt===1?L(0,q):L(q,0),b=pt===1?L(1,q):L(q,1),c=pt===1?R(0,q):R(q,0),d=pt===1?R(1,q):R(q,1);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.moveTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.stroke()}
  const win=(F,u,v,du,dv)=>poly([F(u,v),F(u+du,v),F(u+du,v+dv),F(u,v+dv)].flat(),"#6fa8c8");
  win(L,.22,.14,.56,.3);win(R,.12,.14,.34,.3);

function plane(x,y,txt){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#fff";ctx.strokeStyle="#444";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,26,7,0,0,7);ctx.fill();ctx.stroke();
  poly([-6,0,-20,-16,-12,-16,6,0],"#e9e9e9");poly([-6,2,-18,14,-10,14,6,2],"#d4d4d4");poly([-22,-2,-30,-12,-24,-12,-16,-2],"#e07b39");
  ctx.strokeStyle="#666";ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-52,0);ctx.stroke();
  ctx.font="bold 13px Segoe UI,sans-serif";const w=ctx.measureText(txt).width+16;
  ctx.fillStyle="#fff3c9";ctx.strokeStyle="#7a5a3a";ctx.beginPath();ctx.roundRect(-52-w,-11,w,22,6);ctx.fill();ctx.stroke();

}

}

  (all.length?all.sort((a,b)=>b.reg-a.reg).map(w=>`<div class="row"><span>@${esc(w.u)}<br><small>${w.code} · ${w.status}</small></span><span>${w.status==="menunggu"?`<button class="btn g s" data-v="${esc(w.u)}">Verifikasi</button>`:""}${w.status==="warga"?`<button class="btn g s" data-c="${esc(w.u)}">+100🪙</button>`:""}<button class="btn x s" data-d="${esc(w.u)}">Hapus</button></span></div>`).join(""):`<p class="mut">Belum ada pendaftar.</p>`)
  +`<p class="mut">Catatan: ini prototipe. Data tersimpan di browser ini saja.</p>`;
  fillSaran();
  $("#sj").onclick=()=>{S.jadwal=$("#jd").value||"19:00";log("Jadwal keberangkatan diubah ke "+S.jadwal);save();vAdmin()};
  $("#vk").onclick=()=>{const k=$("#kd").value.trim().toUpperCase(),w=all.find(x=>x.code===k);
    if(!w)return $("#e").textContent="Kode tidak ditemukan.";
    if(w.status!=="menunggu")return $("#e").textContent="Kode sudah diverifikasi.";
    w.status="siap";log("Kode @"+w.u+" diterima dari bot");save();vAdmin()};
  $("#fly").onclick=()=>{const g=all.filter(w=>w.status==="siap");if(!g.length)return $("#e").textContent="Belum ada penumpang siap terbang.";
    let n=all.filter(w=>w.status==="warga").length;
    g.forEach(w=>{w.status="warga";if(w.lot==null)w.lot=freeLot();w.rt=Math.floor(w.lot/20)%5+1;w.rw=Math.floor(w.lot/100)+1;w.nik=nik(w.u);w.tgl=Date.now();w.coin=100;w.model=w.lot%4;w.wall=walls[(w.lot>>2)%4];w.roof=roofs[w.lot%4];w.lv=1});
    const txt="Warga baru: "+g.map(w=>"@"+w.u).join(", ");
    S.flights.unshift({t:Date.now(),txt});log("Pesawat berangkat membawa "+g.length+" warga baru");save();launch(txt);
    tab="peta";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t==="peta"));render()};
  sheet.onclick=e=>{const v=e.target.dataset.v,d=e.target.dataset.d,c=e.target.dataset.c,wk=e.target.dataset.w,rn=e.target.dataset.r,sid=e.target.dataset.sid;if(rn){doReno(rn).then(vAdmin);return}if(sid){adminStat(sid,e.target.dataset.s);return}if(wk!==undefined){S.wxForce=wk;save();vAdmin();return}if(c){S.warga[c].coin=(S.warga[c].coin||0)+100;log("Walikota memberi 100 koin ke @"+c);save();vAdmin()}
    if(v){S.warga[v].status="siap";log("@"+v+" diverifikasi walikota");save();vAdmin()}
    if(d&&confirm("Hapus @"+d+"?")){delete S.warga[d];log("@"+d+" dihapus");save();vAdmin()}}
}

    for(let L=0;L<2;L++)for(let y=-sp+L*sp*.35;y<H+sp;y+=sp*.7)for(let x=-sp+L*sp*.4;x<W+sp;x+=sp*.8){n++;
      const hx=x+(rr(n,1)-.5)*sp*.5,hy=y+(rr(n,2)-.5)*sp*.4,dx=hx-W/2,dy=(hy-H/2)*.7,m=Math.hypot(dx,dy)||1;
      puffs.push({hx,hy,r:sp*(1.05+rr(n,3)*.5),s:rr(n,4),dl:Math.min(.4,Math.hypot(dx/(W/2),(hy-H/2)/(H/2))*.25),vx:dx/m,vy:dy/m})}}
  const back=k=>1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);
  function frame(now){
    const t=now-t0;if(t>5600){done=true;box.remove();return}
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const p=Math.max(0,Math.min(1,(t-3300)/2100)),ba=Math.max(0,1-p*2.2);
    if(ba>0){const sg=g.createLinearGradient(0,0,0,H);sg.addColorStop(0,"#8cc6ef");sg.addColorStop(1,"#d3ebfa");g.globalAlpha=ba;g.fillStyle=sg;g.fillRect(0,0,W,H)}
    for(const f of puffs){const u=Math.max(0,Math.min(1,(p-f.dl)/(1-f.dl))),d=u*u*Math.max(W,H)*.95,bob=Math.sin(t/700+f.s*6)*4*(1-p),sz=f.r*2*(1+u*.35);
      g.globalAlpha=1-Math.max(0,(u-.4)/.6);g.drawImage(spr,f.hx+f.vx*d-sz/2,f.hy+f.vy*d+bob-sz/2,sz,sz)}
    g.globalAlpha=1;
    let la=0,sc=1;
    if(t>=600&&t<1500){const k=(t-600)/900;la=Math.min(1,k*2.2);sc=.35+.65*back(k)}
    else if(t>=1500&&t<3000){la=1;sc=1+.03*(t-1500)/1500}
    else if(t>=3000&&t<3600){const k=(t-3000)/600;la=1-k;sc=1.03+.35*k*k}
    if(la>0&&img.complete&&img.naturalWidth){
      const lw=Math.min(W*.86,760)*sc,lh=lw*img.naturalHeight/img.naturalWidth,cx=W/2,cy=H/2+Math.sin(t/500)*4,gl=g.createRadialGradient(cx,cy,0,cx,cy,lw*.62);
      gl.addColorStop(0,"rgba(90,170,245,"+.55*la+")");gl.addColorStop(1,"rgba(90,170,245,0)");g.fillStyle=gl;g.fillRect(cx-lw,cy-lw,lw*2,lw*2);
      g.globalAlpha=la;g.drawImage(img,cx-lw/2,cy-lh/2,lw,lh);g.globalAlpha=1}
    if(t<3000){g.font="600 13px Segoe UI,sans-serif";g.textAlign="center";g.fillStyle="rgba(40,70,120,"+.8*(1-t/3000)+")";g.fillText("ketuk untuk lewati",W/2,H-28)}
    requestAnimationFrame(frame)}
  layout();addEventListener("resize",()=>{if(!done)layout()});
  box.addEventListener("pointerdown",()=>{const t=performance.now()-t0;if(t<3300)t0=performance.now()-3300});
  frame(performance.now());box.style.background="transparent"}
render();loadWX();setInterval(loadWX,6e5);startIntro();initOnline();
</script>
